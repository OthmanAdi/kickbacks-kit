[package]
name = "kickbacks-kit"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Read-only companion tools for the kickbacks.ai extension: archive every ad you see and watch your stats in a TUI. Observes local artifacts only, never writes billing events."
authors = ["Ahmad Othman Ammar Adi"]
license = "MIT"
repository = "https://github.com/OthmanAdi/kickbacks-kit"
homepage = "https://github.com/OthmanAdi/kickbacks-kit"
keywords = ["kickbacks", "tui", "ratatui", "claude-code", "ads"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# Live status feed: a small blocking HTTP client (no async runtime) with rustls
# so kb stays free of OpenSSL on every platform. Used only for read-only GETs of
# public endpoints (GitHub API, the kickbacks.ai public status bulletin); never
# for any billing, auth, or earnings route.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Open a feed link in the user's browser from the TUI. Uses ShellExecuteW on
# Windows (no cmd.exe, so a `&` in a URL is safe) and the platform opener
# elsewhere; the hardened feature refuses non-http(s) URLs.
webbrowser = { version = "1", default-features = false, features = ["hardened"] }
# Display-column width of text, so feed titles and links with CJK or wide
# characters align and truncate by terminal columns, not char count. ratatui
# already pins this transitively; we depend on it directly for our own math.
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
